name: price-tracker

on:
  schedule:
    - cron: '17 1 * * *'   # 每天 09:17 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public prices
        run: node tools/price-tracker.js
      - name: Commit snapshot if changed
        run: |
          git config user.name "price-tracker[bot]"
          git config user.email "price-tracker@users.noreply.github.com"
          git add data/prices.json data/prices.md
          git diff --cached --quiet && echo "no change" || git commit -m "data: price snapshot $(date -u +%F)" && git push
